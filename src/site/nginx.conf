# The Parla website as a plain static site (the image from ../../Dockerfile). Behind a proxy that ends TLS.
server {
    listen 8080 default_server;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json;
    root /usr/share/nginx/html;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / {
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    # hashed file names: cache forever
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
