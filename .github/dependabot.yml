# Keeps every pin current (supply chain: pinned + updated, never floating): GitHub actions (commit SHAs), npm lockfiles,
# Docker base images (digests). Pull requests go to `development`, where CI builds and tests them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # a release must be a week old: most malicious versions are caught by then
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    # not examples/ or src/site: they depend on the locally built package (file:../../build/...), which Dependabot
    # cannot fetch (it aborts the whole job); their lockfiles are still covered by Dependabot security alerts
    directories: [/, /tests, /tools/release]
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # a release must be a week old: most malicious versions are caught by then
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/, /tests]
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # a release must be a week old: most malicious versions are caught by then
    ignore:
      # a new Rust or Node major goes everywhere at once (rust-toolchain.toml, the workflow, the images) and is
      # checked against the golden outputs: a deliberate upgrade, not a pull request per image
      - dependency-name: rust
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
