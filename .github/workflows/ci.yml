# Build and release (docs/releasing.md).
#   - every push to `development` / `master` and every pull request: build everything; the files are the run's artifact
#   - a push (merge) to `master`:
#     - when something the extension / SDK / npm package ships changed since the last tag (tools/next_version.ts):
#       the next semantic version from those commits (feat -> minor, fix / other -> patch, `!` or BREAKING CHANGE
#       -> major), stamped into every build, then a GitHub release `vX.Y.Z` (the tag) with the files to download,
#       and the extension to the Chrome Web Store and Firefox Add-ons and the package to npm (each skipped while its
#       secrets are missing)
#     - always: the website to GitHub Pages (parla.cc; it offers the latest release for download) and the report
#       receiver to Cloudflare. A merge that changes only the website (or docs, tests, CI) releases nothing else.
# Supply chain: actions pinned by commit SHA, exact Node / Rust / binaryen versions (binaryen checked by SHA-256),
# npm installs only from lockfiles with install scripts off (.npmrc) and registry signatures verified, the release
# tools from tools/release/package-lock.json, no token left in .git (persist-credentials: false). Dependabot keeps
# the pins current (.github/dependabot.yml).
name: Build and release

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (on master; auto = from the commit messages)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

env:
  NODE_VERSION: 26.13.0
  BINARYEN: version_133
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      current: ${{ steps.next.outputs.current }}
      release: ${{ steps.next.outputs.release }}
      deploy: ${{ steps.next.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: next
        name: Next version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          next=$(node tools/next_version.ts --bump "$BUMP")
          echo "$next" | tee -a "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            if echo "$next" | grep -q '^version=.'; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    runs-on: ubuntu-24.04
    env:
      # on master the builds carry the current release's version (the new one, or the last one when only the website
      # changed: the website's install page links that release's files); other builds keep the source's
      VERSION_ARG: ${{ needs.version.outputs.deploy == 'true' && format('--version {0}', needs.version.outputs.current) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Rust (src/engine/rust-toolchain.toml) and wasm-opt (checked by SHA-256)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.0
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tgz" "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/binaryen.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/binaryen.tgz" -C "$RUNNER_TEMP"
          echo "WASM_OPT=$RUNNER_TEMP/binaryen-$BINARYEN/bin/wasm-opt" >> "$GITHUB_ENV"

      - name: npm ci from the lockfiles (no install scripts), registry signatures verified
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests --no-audit --no-fund
          npm audit signatures
          npm audit signatures --prefix tests

      - name: Type-check
        run: python3 build.py check

      - name: Engine (the three builds the extension and the SDK ship)
        run: for i in 0 1 2; do python3 build.py wasm --only $i; done

      - name: Extension for Chrome and Firefox
        run: |
          python3 build.py extension --zip $VERSION_ARG
          python3 build.py extension --browser firefox --zip $VERSION_ARG

      - name: npm package and SDK files
        run: |
          python3 build.py npm $VERSION_ARG
          python3 build.py sdk --models deepfilternet3,gtcrn,rnnoise $VERSION_ARG
          (cd build/sdk && zip -qr ../sdk.zip .)

      - name: Browser tests (extension in Chromium and Firefox, website, SDK, examples; Docker)
        run: |
          python3 build.py site
          python3 build.py examples
          python3 build.py test

      - name: Website image (Dockerfile; its base images are pinned and updated by Dependabot)
        run: |
          docker build -q -t parla-site .
          docker run -d --rm -p 8080:8080 --name parla-site parla-site
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8080/ && curl -fsS -o /dev/null http://127.0.0.1:8080/demo/
          docker rm -f parla-site

      - name: Website for GitHub Pages (every merge into master)
        if: needs.version.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parla
          path: |
            build/extension.zip
            build/extension-firefox.zip
            build/tvildo-parla-*.tgz
            build/sdk.zip

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parla
      - name: Tag and GitHub release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mv extension.zip "parla-chrome-$TAG.zip"
          mv extension-firefox.zip "parla-firefox-$TAG.zip"
          mv sdk.zip "parla-sdk-$TAG.zip"
          gh release create "$TAG" parla-*.zip tvildo-parla-*.tgz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Parla $TAG" --generate-notes

  chrome:
    needs: [version, release]
    runs-on: ubuntu-24.04
    environment: stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parla
          path: dist
      - name: Chrome Web Store (upload and publish; the uploader from tools/release's lockfile)
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then echo "::notice::no Chrome Web Store secrets yet: skipped"; exit 0; fi
          npm ci --prefix tools/release --no-audit --no-fund && npm audit signatures --prefix tools/release
          tools/release/node_modules/.bin/chrome-webstore-upload --source dist/extension.zip

  firefox:
    needs: [version, release]
    runs-on: ubuntu-24.04
    environment: stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parla
      - name: Firefox Add-ons (listed, with the source code; web-ext from tools/release's lockfile)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_SECRET" ]; then echo "::notice::no Firefox Add-ons secrets yet: skipped"; exit 0; fi
          git -C source archive --format=zip -o "$PWD/source.zip" HEAD
          mkdir firefox && unzip -q extension-firefox.zip -d firefox
          npm ci --prefix source/tools/release --no-audit --no-fund && npm audit signatures --prefix source/tools/release
          source/tools/release/node_modules/.bin/web-ext sign --source-dir firefox --artifacts-dir web-ext-artifacts \
            --channel listed --upload-source-code source.zip --approval-timeout 0

  npm:
    needs: [version, release]
    runs-on: ubuntu-24.04
    environment: stores
    permissions:
      id-token: write   # npm trusted publishing: a short-lived OIDC proof for this run, no npm token anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parla
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: npm publish @tvildo/parla (trusted publishing, with provenance)
        env:
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" != true ]; then echo "::notice::npm trusted publishing not switched on (repo variable NPM_TRUSTED_PUBLISHING): skipped"; exit 0; fi
          npm publish tvildo-parla-*.tgz --access public --provenance

  telemetry:
    needs: [version, build]
    if: needs.version.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment: telemetry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Report receiver to Cloudflare (t.parla.cc)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # the limits live in the environment's variables, so a release never resets a share turned down by hand
          SAMPLE: ${{ vars.TELEMETRY_SAMPLE || '1' }}
          DAILY_LIMIT: ${{ vars.TELEMETRY_DAILY_LIMIT || '80000' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::no Cloudflare secrets yet: skipped"; exit 0; fi
          npm ci --no-audit --no-fund && npm audit signatures
          node src/telemetry/worker.test.ts
          python3 build.py telemetry-deploy --sample "$SAMPLE" --daily-limit "$DAILY_LIMIT"

  pages:
    # after the release (if there is one), so the install page never links files that don't exist yet
    needs: [version, build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.version.outputs.deploy == 'true' && contains(fromJSON('["success", "skipped"]'), needs.release.result) }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Website to GitHub Pages (parla.cc)
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
